<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff3c00" stop-opacity="0"/><stop offset=".5" stop-color="#ffb199"/><stop offset="1" stop-color="#ff3c00" stop-opacity="0"/></linearGradient>
  <filter id="b"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>
  .run{animation:run 3.5s ease-in-out infinite}
  @keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
</style>
<line x1="0" y1="12" x2="1000" y2="12" stroke="#ff3c00" stroke-opacity=".25" stroke-width="2"/>
<rect x="495" y="7" width="10" height="10" fill="#ff3c00" transform="rotate(45 500 12)"/>
<g class="run"><rect width="200" height="4" y="10" fill="url(#g)" filter="url(#b)"/><rect width="200" height="2" y="11" fill="url(#g)"/></g>
</svg>
