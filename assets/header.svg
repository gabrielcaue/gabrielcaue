<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050505"/><stop offset=".6" stop-color="#120303"/><stop offset="1" stop-color="#2b0600"/>
  </linearGradient>
  <linearGradient id="blade" x1="0" x2="1">
    <stop offset="0" stop-color="#ff3c00" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff3c00" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ff3c00" stroke-opacity=".07"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>
  .ember{fill:#ff5a1f;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-360px);opacity:0}}
  .kanji{font:900 230px 'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif;fill:#ff3c00;opacity:.06}
  .name{font:900 66px 'Segoe UI',Arial,Helvetica,sans-serif;letter-spacing:6px}
  .aura{fill:#ff3c00;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .sub{font:700 19px 'Consolas','Courier New',monospace;fill:#ff6a33;letter-spacing:7px;animation:fade 1.5s ease-out both .4s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .slash{animation:slash 5s cubic-bezier(.7,0,.3,1) infinite}
  @keyframes slash{0%{transform:translateX(-1300px)}14%{transform:translateX(1300px)}100%{transform:translateX(1300px)}}
  .flash{fill:#fff;animation:flash 5s infinite}
  @keyframes flash{0%,5%{opacity:0}7%{opacity:.12}12%,100%{opacity:0}}
  .hud{fill:none;stroke:#ff3c00;stroke-width:3}
  .dot{fill:#39ff6a;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .status{font:700 14px 'Consolas','Courier New',monospace;fill:#e8e8e8;letter-spacing:3px}
  .scan{fill:#ff3c00;opacity:.05;animation:scan 4s linear infinite}
  @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
</style>

<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<text x="500" y="250" text-anchor="middle" class="kanji">開発者</text>
<rect class="scan" width="1000" height="30"/>

  <circle class="ember" cx="351" cy="335" r="3.1" style="animation-duration:6.0s;animation-delay:-0.4s"/>
  <circle class="ember" cx="860" cy="335" r="2.3" style="animation-duration:5.8s;animation-delay:-0.5s"/>
  <circle class="ember" cx="539" cy="335" r="1.6" style="animation-duration:4.4s;animation-delay:-3.3s"/>
  <circle class="ember" cx="266" cy="335" r="1.4" style="animation-duration:6.1s;animation-delay:-6.6s"/>
  <circle class="ember" cx="146" cy="335" r="3.1" style="animation-duration:7.2s;animation-delay:-4.7s"/>
  <circle class="ember" cx="83" cy="335" r="2.4" style="animation-duration:6.0s;animation-delay:-7.8s"/>
  <circle class="ember" cx="67" cy="335" r="2.3" style="animation-duration:4.7s;animation-delay:-3.4s"/>
  <circle class="ember" cx="573" cy="335" r="1.4" style="animation-duration:5.5s;animation-delay:-6.5s"/>
  <circle class="ember" cx="205" cy="335" r="1.4" style="animation-duration:6.9s;animation-delay:-1.5s"/>
  <circle class="ember" cx="119" cy="335" r="2.3" style="animation-duration:4.3s;animation-delay:-0.5s"/>
  <circle class="ember" cx="230" cy="335" r="2.2" style="animation-duration:6.7s;animation-delay:-6.2s"/>
  <circle class="ember" cx="496" cy="335" r="2.4" style="animation-duration:6.3s;animation-delay:-2.4s"/>
  <circle class="ember" cx="833" cy="335" r="1.6" style="animation-duration:7.9s;animation-delay:-0.7s"/>
  <circle class="ember" cx="327" cy="335" r="2.3" style="animation-duration:8.4s;animation-delay:-5.8s"/>
  <circle class="ember" cx="314" cy="335" r="2.4" style="animation-duration:4.4s;animation-delay:-4.1s"/>
  <circle class="ember" cx="188" cy="335" r="2.7" style="animation-duration:4.8s;animation-delay:-3.9s"/>
  <circle class="ember" cx="60" cy="335" r="3.1" style="animation-duration:4.4s;animation-delay:-4.5s"/>
  <circle class="ember" cx="828" cy="335" r="3.0" style="animation-duration:5.6s;animation-delay:-5.6s"/>
  <circle class="ember" cx="628" cy="335" r="2.2" style="animation-duration:8.0s;animation-delay:-0.6s"/>
  <circle class="ember" cx="115" cy="335" r="3.1" style="animation-duration:6.4s;animation-delay:-5.3s"/>
  <circle class="ember" cx="82" cy="335" r="2.7" style="animation-duration:5.5s;animation-delay:-4.6s"/>
  <circle class="ember" cx="717" cy="335" r="2.8" style="animation-duration:5.4s;animation-delay:-3.1s"/>
  
<!-- Cantos HUD -->
<path class="hud" d="M20 60V20H60"/><path class="hud" d="M940 20H980V60"/>
<path class="hud" d="M20 260V300H60"/><path class="hud" d="M940 300H980V260"/>

<!-- Nome (troque [SEU NOME] nas DUAS linhas abaixo) -->
<text x="500" y="160" text-anchor="middle" class="name aura" filter="url(#glow)">[SEU NOME]</text>
<text x="500" y="160" text-anchor="middle" class="name" fill="#ffffff">[SEU NOME]</text>
<text x="500" y="200" text-anchor="middle" class="sub">DESENVOLVEDOR JAVA · BACKEND</text>

<!-- Corte de lâmina -->
<g transform="rotate(-14 500 160)"><rect class="slash" x="200" y="158" width="600" height="4" fill="url(#blade)"/></g>
<rect class="flash" width="1000" height="320"/>

<!-- Status -->
<rect x="355" y="236" width="290" height="36" rx="4" fill="#0a0a0a" stroke="#ff3c00" stroke-opacity=".5"/>
<circle class="dot" cx="378" cy="254" r="6"/>
<text x="394" y="259" class="status">ABERTO A OPORTUNIDADES</text>
</svg>
