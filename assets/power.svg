<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#7a1400"/><stop offset="1" stop-color="#ff3c00"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .ttl{font:900 22px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:5px}
  .jp{font:700 14px 'Noto Sans JP','Yu Gothic',sans-serif;fill:#ff3c00;letter-spacing:4px}
  .lbl{font:700 14px 'Consolas','Courier New',monospace;fill:#d0d0d0;letter-spacing:2px}
  .pct{font:700 14px 'Consolas','Courier New',monospace;fill:#ff6a33;opacity:0;animation:in .4s forwards}
  .rank{font:900 20px 'Segoe UI',Arial,sans-serif;opacity:0;animation:pop .5s forwards}
  .rS{fill:#ffcc00} .rA{fill:#ff3c00} .rB{fill:#9a9a9a}
  .fill{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
  .shine{opacity:0;animation:sh 3s ease-in-out infinite}
  @keyframes sh{0%{opacity:0}30%{opacity:1}60%,100%{opacity:0}}
  @keyframes in{to{opacity:1}}
  @keyframes pop{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
  .rank{transform-box:fill-box;transform-origin:center}
</style>
